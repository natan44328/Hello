                Lizenzschlüssel aus deinem Shop akzeptiert.
   ====================================================================== */
const SUPPORT_URL = "";
const PRO_URL = "";
const PRO_PRICE = "4,99 €";
const LS_STORE_ID = 0;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },

  del(k) { try { localStorage.removeItem(k); } catch {} }

/* ---------- Pro-Freischaltung ---------- */
// Ohne PRO_URL ist alles frei. In den Beispieldaten ist alles sichtbar, damit man sieht, was Pro kann.
const proActive = () => !!PRO_URL;
const isPro = () => !proActive() || !!(store.get("fc.pro") || {}).key;
const canUse = () => isPro() || state.isSample;

async function activateLicense(key) {
  const body = new URLSearchParams({ license_key: key, instance_name: "Follow-Check " + new Date().toISOString().slice(0, 10) });
  const res = await fetch("https://api.lemonsqueezy.com/v1/licenses/activate", {
    method: "POST", headers: { Accept: "application/json" }, body
  });
  const j = await res.json().catch(() => ({}));
  if (!j.activated) throw new Error(j.error || "Der Schlüssel ist ungültig oder schon zu oft benutzt.");
  if (LS_STORE_ID && j.meta && j.meta.store_id !== LS_STORE_ID) throw new Error("Dieser Schlüssel gehört nicht zu Follow-Check.");
  store.set("fc.pro", { key, instance: j.instance && j.instance.id, at: Date.now() });
}

/* ---------- ZIP lesen (ohne Bibliothek, nur die nötigen Dateien) ---------- */
async function readZip(file, wanted) {
  const size = file.size;
  const tailLen = Math.min(size, 65557);
  const tail = new DataView(await file.slice(size - tailLen).arrayBuffer());
  let eocd = -1;
  for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("Das ist keine gültige ZIP-Datei.");
  let count = tail.getUint16(eocd + 10, true);
  let cdSize = tail.getUint32(eocd + 12, true);
  let cdOff = tail.getUint32(eocd + 16, true);
  if (cdOff === 0xffffffff || count === 0xffff) {
    const loc = eocd - 20;
    if (loc >= 0 && tail.getUint32(loc, true) === 0x07064b50) {
      const z64off = Number(tail.getBigUint64(loc + 8, true));
      const z = new DataView(await file.slice(z64off, z64off + 56).arrayBuffer());
      count = Number(z.getBigUint64(32, true));
      cdSize = Number(z.getBigUint64(40, true));
      cdOff = Number(z.getBigUint64(48, true));
    }
  }
  const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
  const dec = new TextDecoder();
  const out = [];
  let p = 0;
  for (let n = 0; n < count && p + 46 <= cd.byteLength; n++) {
    if (cd.getUint32(p, true) !== 0x02014b50) break;
    const method = cd.getUint16(p + 10, true);
    let comp = cd.getUint32(p + 20, true);
    let uncomp = cd.getUint32(p + 24, true);
    const nl = cd.getUint16(p + 28, true), xl = cd.getUint16(p + 30, true), cl = cd.getUint16(p + 32, true);
    let lo = cd.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(cd.buffer, p + 46, nl));
    let x = p + 46 + nl;
    const xEnd = x + xl;
    while (x + 4 <= xEnd) {
      const id = cd.getUint16(x, true), len = cd.getUint16(x + 2, true);
      if (id === 1) {
        let q = x + 4;
        if (uncomp === 0xffffffff) { uncomp = Number(cd.getBigUint64(q, true)); q += 8; }
        if (comp === 0xffffffff) { comp = Number(cd.getBigUint64(q, true)); q += 8; }
        if (lo === 0xffffffff) { lo = Number(cd.getBigUint64(q, true)); }
      }
      x += 4 + len;
    }
    p = xEnd + cl;
    if (!wanted(name)) continue;
    const lh = new DataView(await file.slice(lo, lo + 30).arrayBuffer());
    const start = lo + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    const blob = file.slice(start, start + comp);
    let text;
    if (method === 0) text = await blob.text();
    else if (method === 8) text = await new Response(blob.stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    else continue;
    out.push({ name, text });
  }
  return out;
}

/* ---------- Instagram-JSON auswerten ---------- */
const KINDS = [
  ["followers", /(^|\/)followers(_\d+)?\.json$/],
  ["following", /(^|\/)following\.json$/],
  ["closeFriends", /close_friends\.json$/],
  ["pending", /pending_follow_requests\.json$/],
  ["recentRequests", /recent_follow_requests\.json$/],
  ["received", /follow_requests_you'?ve_received\.json$/],
  ["unfollowedByMe", /recently_unfollowed_(profiles|accounts)\.json$/],
  ["blocked", /blocked_(profiles|accounts)\.json$/],
  ["restricted", /restricted_(profiles|accounts)\.json$/]
];
const kindOf = name => (KINDS.find(([, re]) => re.test(name.toLowerCase())) || [])[0];

function entries(json) {
  let arr = Array.isArray(json) ? json : null;
  if (!arr && json && typeof json === "object") arr = Object.values(json).find(Array.isArray);
  if (!arr) return [];
  const res = [];
  for (const it of arr) {
    const s = (it.string_list_data || [])[0] || {};
    let u = s.value || it.title || "";
    if (!u && s.href) u = s.href.replace(/\/+$/, "").split("/").pop();
    u = String(u).trim().replace(/^@/, "");
    if (u) res.push({ u, t: s.timestamp || it.timestamp || 0 });
  }
  return res;
}

function buildData(files) {
  const d = { followers: [], following: [], closeFriends: [], pending: [], recentRequests: [], received: [], unfollowedByMe: [], blocked: [], restricted: [] };
  let found = 0, htmlOnly = false;
  for (const f of files) {
    if (/\.html$/i.test(f.name) && /followers|following/.test(f.name)) htmlOnly = true;
    const k = kindOf(f.name);
    if (!k) continue;
    try { d[k].push(...entries(JSON.parse(f.text))); found++; } catch {}
  }
  for (const k in d) {
    const m = new Map();
    for (const e of d[k]) if (!m.has(e.u.toLowerCase())) m.set(e.u.toLowerCase(), e);
    d[k] = [...m.values()];
  }
  return { d, found, htmlOnly };
}

function analyse(d) {
  const fol = new Set(d.followers.map(e => e.u.toLowerCase()));
  const ing = new Set(d.following.map(e => e.u.toLowerCase()));
  return {
    notBack: d.following.filter(e => !fol.has(e.u.toLowerCase())),
    fans: d.followers.filter(e => !ing.has(e.u.toLowerCase())),
    mutual: d.following.filter(e => fol.has(e.u.toLowerCase()))
  };
}

function diff(prev, cur) {
  const minus = (a, b) => { const s = new Set(b.map(x => x.toLowerCase())); return a.filter(x => !s.has(x.toLowerCase())); };
  return {
    lost: minus(prev.followers, cur.followers),
    gained: minus(cur.followers, prev.followers),
    iUnfollowed: minus(prev.following, cur.following),
    iFollowed: minus(cur.following, prev.following)
  };
}

/* ---------- Zustand ---------- */
const state = {
  data: null, isSample: true, loadedAt: null, compare: null,
  tab: "guide", listKey: "notBack", q: "", sort: "new", limit: 200
};

function loadSaved() {
  const cur = store.get("fc.current");
  if (cur && cur.d) {
    state.data = cur.d; state.isSample = false; state.loadedAt = cur.at;
    const snaps = store.get("fc.snaps") || [];
    state.compare = snaps.length > 1 ? snaps[snaps.length - 2] : null;
    state.tab = "home";
  } else {
    const s = sample();
    state.data = s.d; state.isSample = true; state.compare = s.prev; state.loadedAt = null;
    state.tab = "guide";
  }
}

function saveSnapshot(d) {
  const snap = { date: Date.now(), followers: d.followers.map(e => e.u), following: d.following.map(e => e.u) };
  const snaps = store.get("fc.snaps") || [];
  const prev = snaps[snaps.length - 1] || null;
  snaps.push(snap);
  while (snaps.length > 12) snaps.shift();
  store.set("fc.snaps", snaps);
  store.set("fc.current", { at: snap.date, d });
  return prev;
}

/* ---------- Dateien laden ---------- */
async function readInput(fileList) {
  const files = [];
  for (const f of fileList) {
    if (/\.zip$/i.test(f.name) || f.type.includes("zip")) {
      files.push(...await readZip(f, n => /\.(json|html)$/i.test(n) && /followers_and_following|connections|followers|following/i.test(n)));
    } else if (/\.json$/i.test(f.name)) {
      files.push({ name: f.name, text: await f.text() });
    }
  }
  return buildData(files);
}

async function onImport(fileList, asOld) {
  if (!fileList || !fileList.length) return;
  notice("Lese Export …", "ok");
  try {
    const { d, found, htmlOnly } = await readInput(fileList);
    if (!d.followers.length && !d.following.length) {
      if (htmlOnly) return notice("<strong>Falsches Format.</strong> Der Export ist im HTML-Format. Bitte neu anfordern und bei „Format“ <b>JSON</b> wählen (siehe Anleitung, Schritt 4).", "err");
      return notice("<strong>Keine Follower-Daten gefunden.</strong> Prüfe, ob du bei der Anforderung „Follower und gefolgte Personen“ angekreuzt hast (Anleitung, Schritt 3).", "err");
    }
    if (asOld) {
      state.compare = { date: null, followers: d.followers.map(e => e.u), following: d.following.map(e => e.u), file: fileList[0].name };
      notice(`<strong>Älterer Export geladen.</strong> Vergleich mit „${esc(fileList[0].name)}“.`, "ok");
      state.tab = "changes";
    } else {
      const prev = saveSnapshot(d);
      state.data = d; state.isSample = false; state.loadedAt = Date.now();
      state.compare = prev;
      notice(`<strong>Fertig.</strong> ${d.followers.length} Follower und ${d.following.length} gefolgte Konten aus ${found} Datei${found === 1 ? "" : "en"} gelesen.` + (prev ? " Mit deinem letzten Stand verglichen." : " Dieser Stand ist gespeichert. Beim nächsten Export siehst du, wer dir entfolgt ist."), "ok");
      state.tab = "home";
    }
    render();
  } catch (e) {
    notice(`<strong>Das hat nicht geklappt.</strong> ${esc(e.message || e)} Lade die ZIP-Datei direkt von Instagram, ohne sie umzubenennen oder zu entpacken.`, "err");
  }
}

function viewHistory() {
  if (!canUse()) return proPanel("Verlauf");
  const d = state.data;
  const months = [];
  const now = new Date();
  for (let i = 11; i >= 0; i--) { const m = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({ key: m.getFullYear() * 12 + m.getMonth(), label: m.toLocaleDateString("de-DE", { month: "short" }).replace(".", ""), f: 0, g: 0 }); }
  const idx = new Map(months.map((m, i) => [m.key, i]));
  const bucket = (arr, k) => { for (const e of arr) if (e.t) { const dt = new Date(e.t * 1000); const i = idx.get(dt.getFullYear() * 12 + dt.getMonth()); if (i !== undefined) months[i][k]++; } };
  bucket(d.followers, "f"); bucket(d.following, "g");
  const max = Math.max(1, ...months.map(m => Math.max(m.f, m.g)));
  const W = 340, H = 190, L = 26, B = 22, T = 14, cw = (W - L) / 12, ch = H - B - T;
  const y = v => T + ch - v / max * ch;
  const ticks = [0, Math.round(max / 2), max].filter((v, i, s) => s.indexOf(v) === i);
  const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Neue Follower und neu gefolgte Konten pro Monat">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
    ${months.map((m, i) => {
      const x = L + i * cw, bw = (cw - 6) / 2;
      return `<rect class="bar" x="${x + 3}" y="${y(m.f)}" width="${bw}" height="${T + ch - y(m.f)}" rx="2"/>
        <rect class="bar2" x="${x + 3 + bw}" y="${y(m.g)}" width="${bw}" height="${T + ch - y(m.g)}" rx="2"/>
        <text x="${x + cw / 2}" y="${H - 6}" text-anchor="middle">${m.label}</text>`;
    }).join("")}
  </svg>`;
  const recent = d.followers.slice().sort((a, b) => b.t - a.t).slice(0, 10);
  const oldest = d.followers.filter(e => e.t).sort((a, b) => a.t - b.t).slice(0, 5);
  return `${sampleBanner()}
    <section class="panel">
      <h2>Pro Monat</h2>
      ${svg}
      <div class="legend"><span><i style="background:var(--accent)"></i>Neue Follower</span><span><i style="background:var(--muted);opacity:.45"></i>Du folgst neu</span></div>
      <p class="small muted">Zählt nur Konten, die dir heute noch folgen bzw. denen du heute noch folgst. Wer zwischendurch wieder entfolgt hat, fehlt im Export.</p>
    </section>
    <section style="display:flex;flex-direction:column;gap:8px"><h2>Neueste Follower</h2>${listItems(recent, "folgt dir seit")}</section>
    <section style="display:flex;flex-direction:column;gap:8px"><h2>Treueste Follower</h2><p class="small muted">Folgen dir am längsten.</p>${listItems(oldest, "folgt dir seit")}</section>`;
}

      <p class="small">Das kann niemand sehen. Instagram speichert Profilbesucher nicht für dich, auch nicht im Export. Apps, die das versprechen, zeigen erfundene Listen und wollen meist dein Passwort. Gib es dort nie ein. Wer deine <b>Story</b> gesehen hat, zeigt dir Instagram selbst, jeweils 48 Stunden lang.</p>
    </section>
    ${licensePanel()}
    ${supportPanel()}`;
}

const VIEWS = { home: viewHome, lists: viewLists, changes: viewChanges, history: viewHistory, guide: viewGuide };

function render() {
  $("#view").innerHTML = `<div class="view" style="display:flex;flex-direction:column;gap:16px">${VIEWS[state.tab]()}</div>`;
  document.querySelectorAll("nav.bar button").forEach(b => {
    if (b.dataset.tab === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  $("#stand").innerHTML = state.isSample ? "Beispiel" : `Stand<br>${fmtStamp(state.loadedAt)}`;
}
function renderList() {
  const a = analyse(state.data), [, , get, label] = LISTS[state.listKey];
  $("#listbox").innerHTML = listItems(sorted(get(a, state.data)), label);
}

document.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-go]");
  if (!t) return;
  if (t.dataset.tab) { state.tab = t.dataset.tab; state.limit = 200; render(); window.scrollTo(0, 0); }
  else if (t.dataset.go) { state.tab = "lists"; state.listKey = t.dataset.go; state.q = ""; state.limit = 200; render(); window.scrollTo(0, 0); }
  else if (t.dataset.tabGo) { state.tab = t.dataset.tabGo; render(); window.scrollTo(0, 0); }
  else if (t.dataset.list) { state.listKey = t.dataset.list; state.limit = 200; render(); }
  else if ("more" in t.dataset) { state.limit += 500; state.tab === "lists" ? renderList() : render(); }
  else if ("activate" in t.dataset) {
    const key = ($("#lic").value || "").trim();
    if (!key) return toast("Bitte Lizenzschlüssel einfügen");
    t.disabled = true; t.textContent = "Prüfe …";
    try { await activateLicense(key); render(); toast("Pro freigeschaltet. Danke!"); }
    catch (err) {
      t.disabled = false; t.textContent = "Freischalten";
      notice(`<strong>Freischalten hat nicht geklappt.</strong> ${esc(err.message === "Failed to fetch" ? "Keine Verbindung zum Lizenzserver. Prüfe dein Internet und versuch es nochmal." : err.message)}`, "err");
    }
  }
  else if ("copy" in t.dataset) {
    if (!canUse()) { window.open(PRO_URL, "_blank", "noopener"); return; }
    const a = analyse(state.data), text = sorted(LISTS[state.listKey][2](a, state.data)).map(e => e.u).join("\n");
    try { await navigator.clipboard.writeText(text); toast("Namen kopiert"); }
    catch { toast("Kopieren ging nicht"); }
  } else if ("reset" in t.dataset) {
    if (t.dataset.confirm) { store.del("fc.snaps"); store.del("fc.current"); loadSaved(); state.tab = "guide"; render(); toast("Gelöscht"); }
    else { t.dataset.confirm = "1"; t.textContent = "Wirklich löschen? Nochmal tippen"; t.style.color = "var(--bad)"; }
  }
});
document.addEventListener("change", e => {
  if (e.target.type === "file") { onImport(e.target.files, !!e.target.dataset.old); }
  else if (e.target.id === "sort") { state.sort = e.target.value; renderList(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { state.q = e.target.value; state.limit = 200; renderList(); }
});

loadSaved();
render();
</script>
</body>
</html>
